<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables & Forms</title>
</head>
<body>
    <table border="5"> <!--border tablonun çizgierini oluşturdu-->
        <thead > <!--table head-->
            <th>İsim</th>
            <th>Maaş</th>
            <th>Departman</th>
            <th>Yaş</th>
        </thead>

        <tr><!--table row-->
            <td>Alperen Şimşek</td><!--table data-->
            <td>2500</td>
            <td>Müdendis</td>
            <td>20</td>
        </tr>

        <tr>
            <td>Cengiz Şimşek</td>
            <td>250</td>
            <td>Öğrenci</td>
            <td>14</td>
        </tr>
    </table>
    
</body>
</html>
