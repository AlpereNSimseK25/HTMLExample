<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and Span HTML</title>
</head>
<body>

    <!--div katogorileme yapar görünümü etkilemez yapılan ayarlar tüm katoriyi etkiler -->
    <div style="color: aqua;" >
        <p>merhaba</p>
        <p>dünya</p>
        <p>selam</p>
    </div>

    <div>
        <p>merhaba</p>
        <!--span div in altında katogorileme yapmak için kullanılır-->
        <span style="color: brown;">
            <p>dünya</p>
            <p>selam</p>
        </span>
    </div>
</body>
</html>
